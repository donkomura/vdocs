[workspace]
resolver = "2"
members = ["crates/vim_core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["donkomura"]
license = "MIT"
description = "Vim-like editing for Google Docs"
repository = "https://github.com/donkomura/vdocs"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
